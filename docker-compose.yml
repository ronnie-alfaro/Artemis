services:
  artemis-api:
    build: ./backend
    environment:
      ARTEMIS_LOG_LEVEL: ${ARTEMIS_LOG_LEVEL:-INFO}
      SEERR_BASE_URL: ${SEERR_BASE_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      ARTEMIS_CONFIG_ENCRYPTION_KEY: ${ARTEMIS_CONFIG_ENCRYPTION_KEY:-}
      WHATSAPP_AGENT_TOKEN: ${WHATSAPP_AGENT_TOKEN:-}
      WHATSAPP_AGENT_NAME: ${WHATSAPP_AGENT_NAME:-primary}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-artemis}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artemis}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, whatsapp-egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  artemis-web:
    build: ./frontend
    depends_on:
      artemis-api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artemis}
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
networks:
  internal:
    internal: true
  edge: {}
  whatsapp-egress: {}
