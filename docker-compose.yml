services:
  artemis-api:
    build: ./backend
    group_add: ["10002"]
    volumes:
      - memory-data:/data/memory
      - ${ARTEMIS_CODEX_STATE_DIR:-/var/lib/artemis-codex}/queue:/data/codex
      - ${ARTEMIS_ANTIGRAVITY_STATE_DIR:-/var/lib/artemis-antigravity}/queue:/data/antigravity
    environment:
      ARTEMIS_CURIOSITY_ALLOWED_URLS: ${ARTEMIS_CURIOSITY_ALLOWED_URLS:-}
      ARTEMIS_ADMIN_TOKEN: ${ARTEMIS_ADMIN_TOKEN:-}
      ARTEMIS_CONTEXT_TOKEN: ${ARTEMIS_CONTEXT_TOKEN:-}
      ARTEMIS_BRIDGE_URL: ${ARTEMIS_BRIDGE_URL:-}
      ARTEMIS_BRIDGE_ALLOWED_URLS: ${ARTEMIS_BRIDGE_ALLOWED_URLS:-}
      ARTEMIS_MEMORY_DIR: /data/memory
      ARTEMIS_VISION_URL: ${ARTEMIS_VISION_URL:-}
      ARTEMIS_VISION_MODEL: ${ARTEMIS_VISION_MODEL:-}
      ARTEMIS_ANTIGRAVITY_QUEUE_DIR: /data/antigravity
      ARTEMIS_CODEX_QUEUE_DIR: /data/codex
      ARTEMIS_WEBHOOK_WHATSAPP_RECIPIENT: ${ARTEMIS_WEBHOOK_WHATSAPP_RECIPIENT:-}
      ARTEMIS_WEBHOOK_TOKEN: ${ARTEMIS_WEBHOOK_TOKEN:-}
      ARTEMIS_LOG_LEVEL: ${ARTEMIS_LOG_LEVEL:-INFO}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEERR_BASE_URL: ${SEERR_BASE_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      TMDB_RAT: ${TMDB_RAT:-}
      TMDB_API: ${TMDB_API:-}
      ARTEMIS_KMS_KEY_ID: ${ARTEMIS_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      ARTEMIS_CONFIG_ENCRYPTION_KEY: ${ARTEMIS_CONFIG_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      WHATSAPP_AGENT_TOKEN: ${WHATSAPP_AGENT_TOKEN:-}
      WHATSAPP_AGENT_NAME: ${WHATSAPP_AGENT_NAME:-primary}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-artemis}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artemis}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, whatsapp-egress, seerr, bridge-internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  artemis-web:
    build: ./frontend
    depends_on:
      artemis-api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  artemis-bridge:
    build: ./bridge
    environment:
      ARTEMIS_CONTEXT_TOKEN: ${ARTEMIS_CONTEXT_TOKEN:-}
    restart: unless-stopped
    networks: [bridge-internal, bridge-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728
          mode: 1023
      - ${ARTEMIS_BRIDGE_ADAPTERS_DIR:-/var/lib/artemis-bridge/adapters}:/providers:ro
      - ${ARTEMIS_BRIDGE_STATE_DIR:-/var/lib/artemis-bridge/state}:/state
      - ${ARTEMIS_BRIDGE_CODEX_BIN_DIR:-/usr/local/lib/artemis-codex/bin}:/cli/codex:ro
      - ${ARTEMIS_BRIDGE_AGY_BIN_DIR:-/var/lib/artemis-bridge/agy-bin}:/cli/agy:ro
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artemis}
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  memory-data:
  postgres-data:
networks:
  internal:
    internal: true
  edge: {}
  whatsapp-egress: {}
  bridge-internal:
    internal: true
  bridge-egress: {}
  seerr:
    external: true
    name: seerr_default
