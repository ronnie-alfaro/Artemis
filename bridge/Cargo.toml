[package]
name = "artemis-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
nix = { version = "0.30", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
