[project]
name = "artemis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.2,<3", "chromadb>=1.1.13,<2", "sentence-transformers>=5.1,<6", "boto3>=1.35,<2", "defusedxml>=0.7.1,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "prometheus-client>=0.20,<1", "httpx>=0.27,<1", "jsonschema>=4.18,<5", "asyncpg>=0.30,<1", "cryptography>=50,<51"]

[project.optional-dependencies]
dev = ["types-defusedxml>=0.7,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "bandit>=1.7,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["._*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore.*", "chromadb", "chromadb.*", "sentence_transformers"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*"]
follow_imports = "skip"
