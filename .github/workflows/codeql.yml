name: CodeQL
on: {push: {branches: [main]}, pull_request: {}, schedule: [{cron: '20 4 * * 1'}]}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: {actions: read, security-events: write, contents: read}
    strategy: {matrix: {language: [python, javascript-typescript]}}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: {languages: '${{ matrix.language }}'}
      - uses: github/codeql-action/analyze@v4
        with: {upload: false, output: codeql-results}
      # GitHub Code Scanning is disabled for this repository. Preserve the
      # analyzer output until the repository setting is enabled for upload.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results
          if-no-files-found: warn
