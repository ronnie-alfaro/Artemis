name: CodeQL
on: {push: {branches: [main]}, pull_request: {}, schedule: [{cron: '20 4 * * 1'}]}
jobs:
  analyze:
    # Dependabot PR tokens cannot upload code-scanning results. The same code
    # is scanned after merge to main, where the workflow has write permission.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {actions: read, security-events: write, contents: read}
    strategy: {matrix: {language: [python, javascript-typescript]}}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: {languages: '${{ matrix.language }}'}
      - uses: github/codeql-action/analyze@v4
