name: Security scans
on: [pull_request, push]
permissions: {actions: read, contents: read, security-events: write}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t artemis-api:scan backend
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: artemis-api:scan, format: table, severity: "HIGH,CRITICAL", exit-code: '0', ignore-unfixed: true, scanners: vuln}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: artemis-api:scan, format: sarif, output: trivy-results.sarif, severity: "HIGH,CRITICAL", limit-severities-for-sarif: true, exit-code: '1', ignore-unfixed: true, scanners: vuln}
      # Preserve SARIF even when GitHub Code Scanning is not enabled.
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: trivy-sarif, path: trivy-results.sarif, if-no-files-found: error}
