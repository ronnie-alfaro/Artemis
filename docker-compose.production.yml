services:
  artemis-api:
    environment:
      ARTEMIS_ENV: production
      ARTEMIS_ADMIN_TOKEN: ${ARTEMIS_ADMIN_TOKEN:?set ARTEMIS_ADMIN_TOKEN}
      ARTEMIS_CONFIG_ENCRYPTION_KEY: ${ARTEMIS_CONFIG_ENCRYPTION_KEY:?set ARTEMIS_CONFIG_ENCRYPTION_KEY}
      WHATSAPP_AGENT_TOKEN: ${WHATSAPP_AGENT_TOKEN:?set WHATSAPP_AGENT_TOKEN}
    restart: unless-stopped
    init: true
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  artemis-web:
    restart: unless-stopped
    init: true
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
  postgres:
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
